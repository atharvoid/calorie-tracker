name: Diagnose UI polish migration

on:
  push:
    branches:
      - feat/ui-redesign-final-polish

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Capture migration output
        run: |
          set +e
          python3 scripts/apply-ui-polish.py > ui-polish-error.txt 2>&1
          echo "exit_code=$?" >> ui-polish-error.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ui-polish-error.txt
          git commit -m "chore(ui): record migration diagnostics"
          git push
