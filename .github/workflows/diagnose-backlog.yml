# TEMPORARY WORKFLOW — MUST BE DELETED BEFORE MERGE.
#
# Applies canonical Prettier formatting and commits the result. Needed because
# prettier-plugin-tailwindcss sorts utility classes into an order that cannot
# be reproduced reliably by hand.
name: Diagnose backlog branch

on:
  push:
    branches: [chore/post-p0-backlog]

permissions:
  contents: write

jobs:
  diagnose:
    # Breaks the feedback loop: the commit this job makes is itself a push.
    if: ${{ !contains(github.event.head_commit.message, '[diagnostics]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/post-p0-backlog

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: pnpm format

      - name: Commit the formatted result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply canonical Prettier formatting [diagnostics]" || exit 0
          git push origin HEAD:chore/post-p0-backlog
