name: Diagnose P0 hardening

on:
  push:
    branches: [fix/post-redesign-p0-hardening]
    paths-ignore:
      - ci-diagnostics.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/post-redesign-p0-hardening

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply canonical formatting
        run: pnpm exec prettier --write lib/admin.ts tests/__tests__/admin.test.ts

      - name: Capture checks
        shell: bash
        run: |
          set +e
          : > ci-diagnostics.txt
          for command in "pnpm typecheck" "pnpm lint" "pnpm test:run" "pnpm format:check" "pnpm build"; do
            echo "===== $command =====" >> ci-diagnostics.txt
            DATABASE_URL=postgres://ci:ci@127.0.0.1:5432/ci AUTH_SECRET=ci-placeholder-value-never-used-at-runtime NEXT_PUBLIC_APP_URL=http://localhost:3000 bash -lc "$command" >> ci-diagnostics.txt 2>&1
            echo "exit_code=$?" >> ci-diagnostics.txt
          done

      - name: Commit formatting and diagnostics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/admin.ts tests/__tests__/admin.test.ts ci-diagnostics.txt
          git commit -m "chore(ci): format hardening changes" || exit 0
          git push
