name: Apply final UI polish

on:
  push:
    branches:
      - feat/ui-redesign-final-polish

permissions:
  contents: write

jobs:
  polish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply audited component changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              expected = count if count is not None else 1
              if found != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {found}: {old!r}")
              p.write_text(text.replace(old, new))

          # Replace the hand-rolled mobile account popover with the reusable Sheet.
          shell = Path("components/nutrition/nutrition-shell.tsx")
          text = shell.read_text()
          text = text.replace(
              'import { useCallback, useEffect, useState, useRef } from "react"',
              'import { useCallback, useEffect, useState } from "react"',
          )
          text = text.replace(
              'import { BarChart2, Clock, Settings, Utensils, Plus, LogOut } from "lucide-react"',
              'import { BarChart2, Clock, Settings, Utensils, Plus } from "lucide-react"',
          )
          text = text.replace(
              'import { ThemeToggle } from "@/components/theme-toggle"',
              'import { ThemeToggle } from "@/components/theme-toggle"\nimport { MobileUserSheet } from "./mobile-user-sheet"\nimport { Tooltip, TooltipContent, TooltipTrigger } from "@/components/ui/tooltip"',
          )
          text = text.replace('\tconst [menuOpen, setMenuOpen] = useState(false)\n\tconst menuRef = useRef<HTMLDivElement>(null)\n', '')
          outside_start = text.index('\t// Close avatar menu when clicking outside')
          outside_end = text.index('\n\tconst experience =', outside_start)
          text = text[:outside_start] + text[outside_end + 1:]
          profile_start = text.index('\t\t\t\t\t{/* User profile dropdown */}')
          profile_end = text.index('\n\t\t\t\t</div>\n\t\t\t</header>', profile_start)
          profile = '\t\t\t\t\t{/* User profile sheet */}\n\t\t\t\t\t{user && <MobileUserSheet user={user} />}'
          text = text[:profile_start] + profile + text[profile_end:]
          old_add = '''\t\t\t\t\t{activeTab === "today" && (\n\t\t\t\t\t\t<button\n\t\t\t\t\t\t\tonClick={() => window.dispatchEvent(new CustomEvent("open_meal_composer"))}\n\t\t\t\t\t\t\tclassName="bg-accent/15 text-accent hover:bg-accent/25 rounded-full p-1.5 focus:outline-none"\n\t\t\t\t\t\t\taria-label="Add meal"\n\t\t\t\t\t\t>\n\t\t\t\t\t\t\t<Plus className="h-4 w-4" />\n\t\t\t\t\t\t</button>\n\t\t\t\t\t)}'''
          new_add = '''\t\t\t\t\t{activeTab === "today" && (\n\t\t\t\t\t\t<Tooltip>\n\t\t\t\t\t\t\t<TooltipTrigger\n\t\t\t\t\t\t\t\tonClick={() => window.dispatchEvent(new CustomEvent("open_meal_composer"))}\n\t\t\t\t\t\t\t\tclassName="bg-accent/15 text-accent hover:bg-accent/25 focus-visible:ring-accent flex min-h-11 min-w-11 cursor-pointer items-center justify-center rounded-full transition-colors ease-premium focus-visible:ring-2 focus-visible:outline-none"\n\t\t\t\t\t\t\t\taria-label="Add meal"\n\t\t\t\t\t\t\t>\n\t\t\t\t\t\t\t\t<Plus className="h-4 w-4" />\n\t\t\t\t\t\t\t</TooltipTrigger>\n\t\t\t\t\t\t\t<TooltipContent>Add meal</TooltipContent>\n\t\t\t\t\t\t</Tooltip>\n\t\t\t\t\t)}'''
          if old_add not in text:
              raise SystemExit("Could not locate mobile add-meal action")
          text = text.replace(old_add, new_add)
          shell.write_text(text)

          # Make History navigation discoverable and keyboard-visible.
          week = Path("components/nutrition/week-navigator.tsx")
          text = week.read_text().replace(
              'import { cn } from "@/lib/utils"',
              'import { cn } from "@/lib/utils"\nimport { Tooltip, TooltipContent, TooltipTrigger } from "@/components/ui/tooltip"',
          )
          old_prev = '''\t\t\t\t<button\n\t\t\t\t\tonClick={goPrev}\n\t\t\t\t\tclassName="text-muted hover:text-primary hover:bg-elevated rounded-lg p-1.5 transition-colors"\n\t\t\t\t\taria-label="Previous week"\n\t\t\t\t>\n\t\t\t\t\t<ChevronLeft className="h-4.5 w-4.5" />\n\t\t\t\t</button>'''
          new_prev = '''\t\t\t\t<Tooltip>\n\t\t\t\t\t<TooltipTrigger\n\t\t\t\t\t\tonClick={goPrev}\n\t\t\t\t\t\tclassName="text-muted hover:text-primary hover:bg-elevated focus-visible:ring-accent flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg transition-colors ease-premium focus-visible:ring-2 focus-visible:outline-none"\n\t\t\t\t\t\taria-label="Previous week"\n\t\t\t\t\t>\n\t\t\t\t\t\t<ChevronLeft className="h-4.5 w-4.5" />\n\t\t\t\t\t</TooltipTrigger>\n\t\t\t\t\t<TooltipContent>Previous week</TooltipContent>\n\t\t\t\t</Tooltip>'''
          old_next = '''\t\t\t\t<button\n\t\t\t\t\tonClick={goNext}\n\t\t\t\t\tdisabled={allNextFuture}\n\t\t\t\t\tclassName="text-muted hover:text-primary hover:bg-elevated rounded-lg p-1.5 transition-colors disabled:pointer-events-none disabled:opacity-30"\n\t\t\t\t\taria-label="Next week"\n\t\t\t\t>\n\t\t\t\t\t<ChevronRight className="h-4.5 w-4.5" />\n\t\t\t\t</button>'''
          new_next = '''\t\t\t\t<Tooltip>\n\t\t\t\t\t<TooltipTrigger\n\t\t\t\t\t\tonClick={goNext}\n\t\t\t\t\t\tdisabled={allNextFuture}\n\t\t\t\t\t\tclassName="text-muted hover:text-primary hover:bg-elevated focus-visible:ring-accent flex h-10 w-10 cursor-pointer items-center justify-center rounded-lg transition-colors ease-premium focus-visible:ring-2 focus-visible:outline-none disabled:pointer-events-none disabled:opacity-30"\n\t\t\t\t\t\taria-label="Next week"\n\t\t\t\t\t>\n\t\t\t\t\t\t<ChevronRight className="h-4.5 w-4.5" />\n\t\t\t\t\t</TooltipTrigger>\n\t\t\t\t\t<TooltipContent>Next week</TooltipContent>\n\t\t\t\t</Tooltip>'''
          if old_prev not in text or old_next not in text:
              raise SystemExit("Could not locate week navigation buttons")
          text = text.replace(old_prev, new_prev).replace(old_next, new_next)
          text = text.replace(
              '"flex flex-col items-center rounded-xl px-1 py-2 text-center transition-colors focus:outline-none",',
              '"focus-visible:ring-accent flex min-h-16 flex-col items-center rounded-xl px-1 py-2 text-center transition-colors ease-premium focus-visible:ring-2 focus-visible:outline-none",',
          )
          text = text.replace('className="tabular text-muted sm:text-2xs mt-0.5 hidden font-mono text-[9px] sm:inline"', 'className="tabular text-muted text-2xs mt-0.5 hidden font-mono sm:inline"')
          week.write_text(text)

          # Normalize compact metric cards around a readable 11px floor and 12px padding.
          replace("components/nutrition/macro-summary.tsx", 'className="grid grid-cols-3 gap-2 max-[349px]:grid-cols-1 sm:gap-4"', 'className="grid grid-cols-3 gap-3 max-[349px]:grid-cols-1 sm:gap-4"')
          replace("components/nutrition/macro-summary.tsx", 'className="bg-elevated border-subtle flex flex-col justify-between rounded-xl border p-2 sm:p-3"', 'className="bg-elevated border-subtle flex min-h-28 flex-col justify-between rounded-xl border p-3"')
          replace("components/nutrition/macro-summary.tsx", 'className="text-muted tabular sm:text-2xs mt-0.5 text-[9px] leading-none"', 'className="text-muted tabular text-2xs mt-1 leading-tight"')
          replace("components/nutrition/macro-summary.tsx", 'className="text-muted mt-0.5 block text-right text-[9px] font-medium"', 'className="text-muted text-2xs mt-1 block text-right font-medium"')

          replace("components/nutrition/calorie-progress.tsx", 'className="grid grid-cols-2 gap-2 sm:grid-cols-3"', 'className="grid grid-cols-2 gap-3 sm:grid-cols-3"')
          replace("components/nutrition/calorie-progress.tsx", 'rounded-xl border p-2.5 sm:p-3', 'rounded-xl border p-3', count=3)
          replace("components/nutrition/calorie-progress.tsx", 'className="text-muted sm:text-2xs mt-0.5 text-[9px]"', 'className="text-muted text-2xs mt-1"', count=2)
          replace("components/nutrition/calorie-progress.tsx", 'className="text-muted sm:text-2xs mt-0.5 text-[9px]"', 'className="text-muted text-2xs mt-1"')

          # Improve mobile composer hierarchy, labels, limits, and touch targets.
          replace("components/nutrition/meal-composer.tsx", 'className="bg-canvas/40 md:bg-surface border-subtle md:rounded-card flex-1 overflow-y-auto border px-4 py-6 pb-28 shadow-lg md:relative md:p-5 md:pb-0"', 'className="bg-canvas/40 md:bg-surface border-subtle md:rounded-card flex-1 overflow-y-auto border p-5 pb-28 shadow-lg md:relative md:pb-0"')
          replace("components/nutrition/meal-composer.tsx", 'className="text-muted hover:text-primary hover:bg-elevated absolute top-4 right-4 rounded-lg p-1.5 transition-colors"', 'className="text-muted hover:text-primary hover:bg-elevated focus-visible:ring-accent absolute top-3 right-3 flex h-11 w-11 cursor-pointer items-center justify-center rounded-full transition-colors ease-premium focus-visible:ring-2 focus-visible:outline-none"')
          replace("components/nutrition/meal-composer.tsx", 'className="mb-4"', 'className="mb-5 pr-12"')
          replace("components/nutrition/meal-composer.tsx", '\t\t\t\t\t\t\t<textarea\n', '\t\t\t\t\t\t\t<label htmlFor="meal-description" className="text-primary text-xs font-semibold">\n\t\t\t\t\t\t\t\tMeal description\n\t\t\t\t\t\t\t</label>\n\t\t\t\t\t\t\t<textarea\n\t\t\t\t\t\t\t\tid="meal-description"\n')
          replace("components/nutrition/meal-composer.tsx", '\t\t\t\t\t\t\t\tplaceholder="e.g. 2 fried eggs with 2 slices of whole wheat toast and a cup of black coffee for breakfast"', '\t\t\t\t\t\t\t\tmaxLength={500}\n\t\t\t\t\t\t\t\tplaceholder="e.g. 2 fried eggs with 2 slices of whole wheat toast and a cup of black coffee for breakfast"')
          replace("components/nutrition/meal-composer.tsx", 'flex h-10 flex-1', 'flex h-11 flex-1', count=4)

          replace("app/globals.css", 'animation-timing-function: ease-out;', 'animation-timing-function: var(--ease-premium);')
          PY
      - run: pnpm format
      - name: Commit final polish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "feat(ui): complete responsive spacing and tooltip audit"
          git push
