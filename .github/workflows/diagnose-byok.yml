name: diagnose-byok

on:
  push:
    branches: [feat/byok-rate-limit]

permissions:
  contents: write

jobs:
  diagnose:
    # Loop guard: never react to our own automated commits.
    if: "!contains(github.event.head_commit.message, '[format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply canonical Prettier formatting
        run: pnpm format

      - name: Commit the formatted result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: apply prettier formatting [format]" || exit 0
          git push
