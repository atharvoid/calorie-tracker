name: diagnose-byok

on:
  push:
    branches: [feat/byok-rate-limit]

permissions:
  contents: write

jobs:
  diagnose:
    # Loop guard: never react to our own diagnostics commit.
    if: "!contains(github.event.head_commit.message, '[diagnostics]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Run each step and capture output
        run: |
          set +e
          {
            echo "===== typecheck ====="
            pnpm typecheck 2>&1
            echo "----- exit code: $? -----"
            echo "===== lint ====="
            pnpm lint 2>&1
            echo "----- exit code: $? -----"
            echo "===== test:run ====="
            pnpm test:run 2>&1
            echo "----- exit code: $? -----"
            echo "===== format:check ====="
            pnpm format:check 2>&1
            echo "----- exit code: $? -----"
          } > byok-diagnostics.txt
          cat byok-diagnostics.txt
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
          AUTH_SECRET: ci-placeholder-value-never-used-at-runtime
          NEXT_PUBLIC_APP_URL: http://localhost:3000

      - name: Commit the output back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add byok-diagnostics.txt
          git commit -m "chore: byok diagnostics output [diagnostics]" || exit 0
          git push
